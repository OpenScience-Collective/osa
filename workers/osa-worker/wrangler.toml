# OSA Cloudflare Worker Configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "osa-worker"
main = "index.js"
compatibility_date = "2024-01-01"
account_id = "10f166f3ec8395ff4a219f581c5f359d"

# Production environment (default)
[vars]
BACKEND_URL = "https://api.osc.earth/osa"
ENVIRONMENT = "production"

# Custom domain (#437): a stable, product-owned name for this worker, so the
# frontend widget (and anyone else's CSP allowlist, e.g. nemarOrg/website
# ADR 0017) never has to be updated again just because the account running
# the edge changes. This is the worker's OWN public hostname, distinct from
# BACKEND_URL above, which is the FastAPI backend the worker proxies to.
# The existing osa-worker.<account>.workers.dev name keeps working once this
# is added; a route does not remove the workers.dev default.
[[routes]]
pattern = "assistant.osc.earth"
custom_domain = true
zone_name = "osc.earth"

# Hybrid rate limiting approach:
# - Per-minute (bot protection): Built-in API (fast, in-memory)
# - Per-hour (human abuse): KV (global consistency)

# Per-minute rate limiter (built-in API, free, <1ms latency)
[[ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Per-hour rate limiter (KV, global, 1 write per request)
[[kv_namespaces]]
binding = "RATE_LIMITER_KV"
id = "8f8506b1a7fb400680a00014312c124d"

# Development environment
[env.dev]
name = "osa-worker-dev"
vars = { BACKEND_URL = "https://api.osc.earth/osa-dev", ENVIRONMENT = "development" }

# Custom domain for dev (#437). Single-level subdomain (develop-assistant,
# not develop.assistant) to avoid SSL certificate issues, matching the
# develop-demo.osc.earth convention the frontend already uses.
[[env.dev.routes]]
pattern = "develop-assistant.osc.earth"
custom_domain = true
zone_name = "osc.earth"

# Per-minute rate limiter (dev has higher limit: 60/min)
[[env.dev.ratelimits]]
name = "RATE_LIMITER_MINUTE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# Per-hour rate limiter (KV)
[[env.dev.kv_namespaces]]
binding = "RATE_LIMITER_KV"
id = "6d46ef72877b4129b38ef2ca1e1cd5ea"

# =============================================================================
# Setup Instructions
# =============================================================================
#
# 1. Install wrangler:
#    npm install -g wrangler
#
# 2. Login to Cloudflare:
#    wrangler login
#
# 3. KV namespaces already exist (IDs in this file)
#
# 4. Set secrets:
#    wrangler secret put BACKEND_API_KEY
#    wrangler secret put TURNSTILE_SECRET_KEY
#    wrangler secret put BACKEND_API_KEY --env dev
#    wrangler secret put TURNSTILE_SECRET_KEY --env dev
#
# 5. Deploy:
#    wrangler deploy           # Production
#    wrangler deploy --env dev # Development
#
# 6. Verify:
#    curl https://osa-worker.<your-subdomain>.workers.dev/health
#
# =============================================================================
# Custom Domain Provisioning (#437, one-time, needs zone-level Cloudflare
# access to the osc.earth account -- deploying with `[[routes]]` above
# registers the route but this repo's CI account may not have permission to
# create the Custom Domain / DNS record itself)
# =============================================================================
#
# The `[[routes]]` / `[[env.dev.routes]]` blocks above declare the mapping;
# someone with access to the osc.earth Cloudflare account still needs to run:
#
#   bunx wrangler deploy                 # production: registers assistant.osc.earth
#   bunx wrangler deploy --env dev       # dev: registers develop-assistant.osc.earth
#
# `custom_domain = true` makes wrangler create the Custom Domain (and its
# DNS record) in the osc.earth zone as part of that deploy -- no separate
# `dns_records` API call or dashboard step is required, since the whole
# osc.earth zone is already on Cloudflare. Deploy dev first and verify it
# (curl /health and /version on develop-assistant.osc.earth) before
# deploying production; see PR for #437 for the full checklist.
#
# =============================================================================
# Turnstile Setup
# =============================================================================
#
# 1. Go to Cloudflare Dashboard > Turnstile
# 2. Create a new widget with "Visible" mode
# 3. Add hostnames where the widget will be embedded:
#    - hedtags.org
#    - hed-examples.org
#    - localhost (for development)
# 4. Copy the Site Key (for frontend) and Secret Key (for this worker)
# 5. Set the secret key:
#    wrangler secret put TURNSTILE_SECRET_KEY
