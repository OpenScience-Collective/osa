# OSA - Open Science Assistant
# Docker Compose for easy deployment
#
# Usage:
#   1. Copy ../.env.example to ../.env and configure (or use existing .env in root)
#   2. Run from deploy/: docker-compose up -d
#
# Port allocation: HEDit prod=38427, HEDit dev=38428, OSA prod=38528, OSA dev=38529

services:
  osa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: osa:latest
    container_name: osa
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "38528:38528"
    volumes:
      # Persist knowledge database across container restarts
      - osa-data:/app/data
    environment:
      # API Settings
      - DEBUG=${DEBUG:-false}
      - ROOT_PATH=${ROOT_PATH:-}
      - REQUIRE_API_AUTH=${REQUIRE_API_AUTH:-true}
      - API_KEYS=${API_KEYS:-}

      # LLM Provider Keys (server-side, for shared access)
      # Claude Platform on AWS is the default (see ../.env.example); OpenRouter
      # remains a supported BYOK-only alternative.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - ANTHROPIC_WORKSPACE_ID=${ANTHROPIC_WORKSPACE_ID:-}
      - ANTHROPIC_THINKING_BUDGET_TOKENS=${ANTHROPIC_THINKING_BUDGET_TOKENS:-2048}
      - ANTHROPIC_MAX_OUTPUT_TOKENS=${ANTHROPIC_MAX_OUTPUT_TOKENS:-8000}
      - ANTHROPIC_CACHE_TTL=${ANTHROPIC_CACHE_TTL:-5m}

      # DEFAULT_MODEL and DEFAULT_MODEL_PROVIDER are intentionally not
      # repeated here: env_file above already loads them from ../.env, and
      # redeclaring them here with a stale default would silently win over
      # whatever ../.env says whenever deploy/.env does not also define them.

      # Knowledge Sync API Keys (optional, for higher rate limits)
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SEMANTIC_SCHOLAR_API_KEY=${SEMANTIC_SCHOLAR_API_KEY:-}
      - PUBMED_API_KEY=${PUBMED_API_KEY:-}

      # Knowledge Sync Scheduling
      # SYNC_ENABLED is the master switch; per-community schedules are in config.yaml
      # Empty databases are automatically seeded on startup
      - SYNC_ENABLED=${SYNC_ENABLED:-true}

      # Observability (optional)
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38528/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  osa-data:
    name: osa-data
