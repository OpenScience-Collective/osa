# OSA - Open Science Assistant
# Docker Compose for easy deployment
#
# Usage:
#   1. Copy ../.env.example to ../.env and configure (or use existing .env in root)
#   2. Run from deploy/: docker-compose up -d
#
# Port allocation: HEDit prod=38427, HEDit dev=38428, OSA prod=38528, OSA dev=38529

services:
  osa:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: osa:latest
    container_name: osa
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "38528:38528"
    volumes:
      # Persist knowledge database across container restarts
      - osa-data:/app/data
    # No environment: block here on purpose. Every variable this service
    # needs (API keys, ANTHROPIC_*, sync/observability settings, etc.) is
    # already supplied by env_file above, and every one of them has a
    # default on Settings (src/api/config.py) for when it is absent.
    # An environment: entry of the form `- FOO=${FOO:-default}` resolves
    # at compose time from the shell (or deploy/.env, which does not
    # exist), NOT from env_file, and silently overrides whatever env_file
    # provides with that compose-time value -- verified with
    # `docker compose config`. That is exactly how DEFAULT_MODEL used to
    # pin a stale openai/gpt-oss-120b regardless of the real .env, and the
    # same defect applied to every other entry that used to be declared
    # this way, including every API key. Do not re-add one of these
    # entries without first checking whether it actually needs to win
    # over env_file; if it does, use the pass-through form `- FOO` (no
    # `=`), which does not override env_file when FOO is unset in the
    # compose-invoking shell.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38528/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  osa-data:
    name: osa-data
