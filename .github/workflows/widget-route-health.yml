name: Widget Route Health

# Watches the worker's PUBLIC mounted hosts, which nothing else does (#442).
#
# The status dashboard resolves straight to api.osc.earth/osa, the FastAPI
# backend, so it never traverses the Cloudflare Worker or widget.osc.earth at
# all. That means the dashboard stays green through a total worker-route
# outage, which is precisely the failure this release makes possible: a zone
# route can be detached, a DNS record can change, or a future wrangler default
# can flip workers_dev, and every one of those is invisible to a backend
# health check.
#
# This probe exists because a third party's Content-Security-Policy now points
# at widget.osc.earth (nemarOrg/website ADR 0017). A host other people have
# pinned needs something watching it.

on:
  schedule:
    # Every 15 minutes. Frequent enough to catch an outage inside a working
    # session, infrequent enough not to spend the Actions budget on a check
    # that is almost always green.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe the mounted widget hosts
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.probe.outputs.failed }}
      report: ${{ steps.probe.outputs.report }}
    steps:
      - name: Probe
        id: probe
        run: |
          set +e
          failures=""

          # /health is the worker's own handler and does not need the backend
          # to be healthy to answer, so a failure here is a ROUTE problem.
          # /communities proxies, so it additionally covers the worker being
          # able to reach the backend at all.
          check() {
            local url="$1"
            local want="$2"
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$url")
            if [ "$got" != "$want" ]; then
              echo "FAIL  $url  expected $want, got $got"
              failures="${failures}\n- \`$url\` expected $want, got **$got**"
            else
              echo "ok    $url  $got"
            fi
          }

          check https://widget.osc.earth/osa/health 200
          check https://widget.osc.earth/osa/communities 200
          check https://develop-widget.osc.earth/osa/health 200

          # The legacy hostnames must keep serving while cached, SRI-pinned
          # widget builds still call them (nemarOrg/website#343).
          check https://osa-worker.shirazi-10f.workers.dev/health 200

          # The host gate: /osa is a real path segment on an unmounted host and
          # must NOT be stripped there. A 200 here means the strip went
          # host-blind again, which silently swallows a community named "osa".
          check https://osa-worker.shirazi-10f.workers.dev/osa/health 404

          if [ -n "$failures" ]; then
            {
              echo "failed=true"
              echo "report<<EOF"
              echo -e "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "failed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail the run so the schedule surfaces it
        if: steps.probe.outputs.failed == 'true'
        run: exit 1

  # A separate job, so the issue opens even when the check job fails before its
  # check runs (checkout included): this job checks out only the action it
  # needs, on its own runner. Not on a cancelled run, which is neither green nor
  # failing and which the action would otherwise read as green.
  track:
    name: Track the issue
    needs: probe
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/track-issue
        with:
          label: widget-route-health
          title: 'Widget route health check failing'
          failed: ${{ needs.probe.result == 'failure' || needs.probe.outputs.failed == 'true' }}
          recovery_message: 'all probes'
          report: |
            The scheduled probe of the widget worker hosts is failing.

            ${{ needs.probe.outputs.report || '- The probe job failed before it probed anything; see the run.' }}

            Likely causes, cheapest first:

            - The Cloudflare zone route was detached, so the hostname resolves but nothing serves it (522).
            - A deploy flipped `workers_dev` off, taking the `workers.dev` hostname down.
            - `MOUNTED_HOSTS` and the `[[routes]]` patterns drifted, so the worker is never invoked.
            - The backend itself is down, which shows as `/osa/communities` failing while `/osa/health` still answers.
