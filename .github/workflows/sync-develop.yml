name: Sync develop with main and bump

# Fires after a stable release tag (v*) is published on main. Merges main
# back into develop and bumps develop to `<next-patch>.dev0`, so feature
# branches off develop never collide with the just-released version. This
# replaces the manual "create release PR -> resolve src/version.py
# conflict" dance.
#
# It lands that merge through a PULL REQUEST with auto-merge, not a direct
# push. A ruleset on `develop` requires status checks, so a direct push is
# rejected with GH013 and this workflow failed on every release after that
# ruleset was added, leaving develop quietly behind main (issue #372).
#
# Trigger: Tag and Release workflow completes successfully. The tag-push
# event also triggers release.yml + the deploy pipeline; this workflow
# is independent and only handles the develop-side bookkeeping.
#
# Guards:
#   - Only fires when the upstream Tag and Release run succeeded.
#   - Only fires when the upstream was triggered by a push to main with
#     a stable version (.dev / a / b / rc are filtered out by the regex
#     check inside the run).
#   - Validates the version on main is a clean vX.Y.Z before merging.

on:
  workflow_run:
    workflows: ["Tag and Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Check out main, not develop: under the workflow_run trigger the
      # checkout action's wildcard fetch (+refs/heads/*) intermittently
      # advertises only `main`, so `ref: develop` fails with "a branch or tag
      # with the name 'develop' could not be found" (broke every release through
      # v0.8.4). main is always advertised; we fetch develop by explicit name
      # in the next step, which requests the ref directly and is reliable.
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # CI_ADMIN_TOKEN pushes the sync BRANCH and opens the pull request.
          # It deliberately does not bypass the develop ruleset; the pull
          # request faces the same checks as any other change (issue #372).
          token: ${{ secrets.CI_ADMIN_TOKEN }}

      - name: Check out develop by explicit ref
        run: |
          git fetch origin +refs/heads/develop:refs/remotes/origin/develop
          git checkout -B develop refs/remotes/origin/develop
          git log --oneline -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch main and validate version
        id: main_version
        run: |
          git fetch origin main
          MAIN_VERSION=$(git show origin/main:src/version.py | python -c "import sys; exec(sys.stdin.read()); print(__version__)")
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"

          # Only sync on a clean stable version. Pre-releases on main
          # are unusual; if one appears, ensure-stable-version.yml will
          # strip it and this workflow will re-fire on that tag-release.
          if [[ ! "$MAIN_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::warning::main version $MAIN_VERSION is not a clean release; skipping develop sync."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Merge main into develop
        if: steps.main_version.outputs.skip == 'false'
        run: |
          # Regular merge (--no-ff) preserves the release commit graph,
          # matching the project's "regular merge commits, not squash"
          # rule for develop <-> main.
          git merge --no-ff origin/main \
            -m "chore: sync develop with main after v${{ steps.main_version.outputs.main_version }}"

      - name: Bump develop to next-patch.dev0
        if: steps.main_version.outputs.skip == 'false'
        run: |
          # patch + --prerelease dev on a clean version increments patch
          # and resets prerelease num to 0 (see scripts/bump_version.py
          # bump_version logic). --no-git so the workflow owns the
          # commit and push.
          uv run python scripts/bump_version.py patch --prerelease dev --no-git

          NEW=$(python -c "from src.version import __version__; print(__version__)")
          echo "Bumped develop to $NEW"

          # Sanity-check the format before committing.
          if [[ ! "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.dev0$ ]]; then
            echo "::error::Expected <patch>.dev0, got $NEW"
            exit 1
          fi

          git add src/version.py
          git commit -m "Bump version to $NEW"

      - name: Open a sync pull request and let it auto-merge
        if: steps.main_version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.CI_ADMIN_TOKEN }}
          VERSION: ${{ steps.main_version.outputs.main_version }}
        run: |
          # NOT a direct push. A ruleset on `develop` requires status checks, so
          # `git push origin develop` is rejected with GH013 ("2 of 2 required
          # status checks are expected") regardless of what the token may do.
          # That is why this workflow failed on every release after the ruleset
          # was added, and why `develop` silently fell behind `main` each time
          # (issue #372). A pull request runs the same checks every other change
          # to `develop` faces, and auto-merge lands it without a human.
          #
          # Bot's commit message starts with "Bump version to ..." so
          # auto-bump-dev.yml self-filters on the resulting push.
          BRANCH="chore/sync-develop-after-v${VERSION}"
          git push --force-with-lease origin "HEAD:refs/heads/${BRANCH}"

          # Re-runs are expected: the tag workflow can fire more than once, and
          # a failed earlier attempt may already have opened this. Reuse the
          # open pull request rather than failing on a duplicate.
          EXISTING=$(gh pr list --head "$BRANCH" --base develop --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Reusing open pull request #${EXISTING} for ${BRANCH}"
            PR="$EXISTING"
          else
            PR=$(gh pr create --base develop --head "$BRANCH" \
              --title "chore: sync develop with main after v${VERSION}" \
              --body "Automated by \`sync-develop.yml\` after the v${VERSION} release: merges \`main\` into \`develop\` and bumps \`develop\` to the next dev version, so branches cut from \`develop\` do not collide with the released version.

          Opened as a pull request rather than pushed directly because a ruleset on \`develop\` requires status checks (issue #372)." \
              | grep -oE '[0-9]+$')
          fi

          # Merge commit, not squash: develop <-> main syncs preserve the
          # release commit graph, and a squash would leave git unaware that
          # main's commits are ancestors of develop.
          if ! gh pr merge "$PR" --auto --merge; then
            echo "::warning::Could not enable auto-merge on #${PR}; merge it by hand."
          fi
