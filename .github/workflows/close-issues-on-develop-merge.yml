name: Close issues on merge into develop

# GitHub honours "Closes #N" only for a pull request merged into the DEFAULT
# branch, which is `main`. Feature work merges into `develop`, so those keywords
# did nothing and the issues were closed by hand, or not at all (#659 and #677).
# This closes the issues a pull request names with a closing keyword once it is
# merged into develop, with a comment that links the pull request.
#
# Rule: an issue closes when the pull request that resolves it merges into
# develop. A feature pull request should not name its epic, so an epic stays
# open until its children close and someone closes it.
#
# Security: `pull_request_target` runs in the base-repo context with a token that
# can write issues, so nothing from the pull request is checked out or executed.
# Only the pull request's number and body are read, and the body reaches the shell
# through an environment variable, never through ${{ }} interpolation into the
# script. Only a merged pull request counts, so someone with write access merged
# it; like GitHub's own keywords, its body can name any issue in this repository.

on:
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: close-issues-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - name: Close the issues the pull request names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          # Code is an example, not an instruction: drop fenced blocks, then inline
          # code. Then take a closing keyword, an optional colon, and #N, this
          # repository's owner/name#N, or its issue URL, the forms GitHub honours.
          # shellcheck disable=SC2016  # the backticks in the sed pattern are literal
          numbers=$(printf '%s\n' "$PR_BODY" \
            | sed -e '/^[[:space:]]*```/,/^[[:space:]]*```/d' -e 's/`[^`]*`//g' \
            | grep -oiE "\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? +(https://github\.com/${GH_REPO}/issues/|${GH_REPO}#|#)[0-9]+\b" \
            | grep -oE '[0-9]+$' | sort -un || true)
          if [ -z "$numbers" ]; then
            echo "No closing keyword in the pull request body."
            exit 0
          fi
          failed=0
          err="$RUNNER_TEMP/gh-error.txt"
          for number in $numbers; do
            if [ "$number" = "$PR_NUMBER" ]; then
              continue
            fi
            # The issues API also answers for pull requests; pull_request marks them.
            if ! info=$(gh api "repos/${GH_REPO}/issues/${number}" \
                --jq '[.state, (.pull_request != null)] | @tsv' 2>"$err"); then
              if grep -qE 'HTTP (404|410)' "$err"; then
                echo "#$number does not exist; skipped."
              else
                echo "::error::Could not read #$number: $(cat "$err")"
                failed=1
              fi
              continue
            fi
            state=$(printf '%s' "$info" | cut -f1)
            is_pr=$(printf '%s' "$info" | cut -f2)
            if [ "$is_pr" = "true" ]; then
              echo "#$number is a pull request; skipped."
              continue
            fi
            if [ "$state" != "open" ]; then
              echo "#$number is $state; nothing to close."
              continue
            fi
            if gh issue close "$number" --reason completed \
                --comment "Done in #${PR_NUMBER}, merged into develop. It reaches production with the next release to main."; then
              echo "Closed #$number."
            else
              echo "::error::Could not close #$number."
              failed=1
            fi
          done
          exit "$failed"
