name: Tests

# The one test workflow. It owns the required checks, `Lint`, `Test (3.11)` and
# `Test (3.12)` (rulesets `protect-dev` and `protect-main`), so those job names
# must not change. It used to have a twin, `test.yml`, also named "Tests", that
# ran the same jobs again on every pull request into and push to `main`; this
# file now carries the union of the two: its triggers, the `ruff check .` lint,
# Python 3.13 on main-bound runs, and the hand-started Integration Tests job.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: 'Live tests to run: all, or a part of a test or model name (haiku, sonnet, luna, openrouter)'
        required: false
        default: 'all'
        type: string

# A newer push to a pull request cancels this workflow's run for the older one.
# Every other run (push, schedule, dispatch) gets a group of its own, so pushes
# to develop and main are never cancelled or queued behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How much of this workflow a change needs. Lint and the Test legs are required
  # checks (rulesets protect-dev and protect-main), so they must report on every
  # run, under their own names: a trigger-level path filter would leave them
  # "expected" forever, and a matrix job skipped by a job-level `if:` reports as
  # plain "Test", not "Test (3.12)". So nothing here stops the workflow; Lint and
  # Test always run and skip their steps, and they conclude success.
  #
  # code=false docs=false: a push of a bot bookkeeping commit alone (below).
  #
  # code=false docs=true: only documentation changed. Test runs the two tests that
  # read documentation (test_embed_snippet_hygiene.py scans every tracked text
  # file, docs/**/*.md included, for widget embed snippets; test_privacy_page.py
  # keeps PRIVACY.md naming the widget dialog's controls); nothing else runs.
  # Anything this job cannot classify, or fails on, runs everything.
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.classify.outputs.code }}
      docs: ${{ steps.classify.outputs.docs }}
    steps:
      # For a pull request this is the merge commit, whose first parent is the base
      # it was merged onto, so HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify the changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AUTHOR: ${{ github.event.head_commit.author.email }}
          COMMITTER: ${{ github.event.head_commit.committer.email }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -uo pipefail
          everything() {
            echo "Running everything: $1"
            { echo "code=true"; echo "docs=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT" in
            pull_request)
              files=$(git diff --name-only --no-renames HEAD^1 HEAD) \
                || everything "could not diff the merge commit against its base"
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                everything "a new branch has no previous head to compare with"
              fi
              git fetch --no-tags --depth=1 origin "$BEFORE" \
                || everything "could not fetch the previous head $BEFORE"
              files=$(git diff --name-only --no-renames "$BEFORE" HEAD) \
                || everything "could not diff against the previous head $BEFORE"
              ;;
            *)
              everything "a $EVENT run tests everything"
              ;;
          esac

          if [ -z "$files" ]; then
            everything "no changed files found"
          fi
          echo "Changed files:"
          while IFS= read -r file; do echo "  $file"; done <<< "$files"

          # The bot's version commits: auto-bump-dev.yml's "Bump version to X.devN"
          # on develop and ensure-stable-version.yml's dev-suffix strip on main. Both
          # change src/version.py alone, after the merge they follow was tested, and
          # both are pushed with CI_ADMIN_TOKEN, so github.actor is that token's owner,
          # not the bot; the bot is the commit's author and committer. Skipped only
          # when the whole push changed nothing but src/version.py, so a bookkeeping
          # commit can never hide an untested commit pushed with it. Not on pull
          # requests: sync-develop.yml's pull request ends in a bump commit, and its
          # merge of main into develop must be tested.
          bot="github-actions[bot]@users.noreply.github.com"
          if [ "$EVENT" = "push" ] && [ "$AUTHOR" = "$bot" ] && [ "$COMMITTER" = "$bot" ] \
            && [ "$files" = "src/version.py" ]; then
            case "$MESSAGE" in
              "Bump version to "*|"chore: strip dev suffix for stable release"*)
                echo "A bot version commit pushed alone; its code was tested on the commit before it"
                { echo "code=false"; echo "docs=false"; } >> "$GITHUB_OUTPUT"
                exit 0
                ;;
            esac
          fi

          # Documentation is an allow-list: Markdown under docs/, .context/ and
          # .rules/, Markdown at the repository root, and LICENSE. Any other path,
          # a new directory or file type included, counts as code.
          while IFS= read -r file; do
            case "$file" in
              docs/*.md|.context/*.md|.rules/*.md|LICENSE) ;;
              */*) everything "$file is not documentation" ;;
              *.md) ;;
              *) everything "$file is not documentation" ;;
            esac
          done <<< "$files"

          echo "Only documentation changed"
          { echo "code=false"; echo "docs=true"; } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    # Always runs (it is a required check); its steps skip when nothing it checks
    # changed. A failed `changes` job leaves `code` empty, which runs everything.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUN_ALL: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN_ALL == 'true'

      - name: Set up Python
        if: env.RUN_ALL == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        if: env.RUN_ALL == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: env.RUN_ALL == 'true'
        run: |
          uv sync --frozen --extra dev

      - name: Ruff check
        if: env.RUN_ALL == 'true'
        run: |
          uv run ruff check .

      - name: Ruff format check
        if: env.RUN_ALL == 'true'
        run: |
          uv run ruff format --check src tests

      # Scoped to the notebook site's own workflows (PR review finding, #465):
      # a hand-written run: block there is exactly the kind of shell mistake
      # actionlint's embedded shellcheck catches, and nothing else in this
      # repository's CI statically checks a workflow file at all. Not run
      # against every workflow in .github/workflows/ -- fixing whatever that
      # would surface elsewhere is a separate change. Version pinned so a new
      # actionlint release cannot silently change what this step accepts.
      - name: Check the notebook site workflows with actionlint
        if: env.RUN_ALL == 'true'
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/deploy-notebook.yml .github/workflows/notebook-site-check.yml

  test:
    name: Test
    needs: [changes, lint]
    # Always runs after a passing Lint (it is a required check, and a skipped
    # matrix job would report as "Test" rather than "Test (3.12)"); its steps
    # decide what to do from `changes`.
    if: ${{ !cancelled() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 21
    env:
      RUN_ALL: ${{ needs.changes.outputs.code != 'false' }}
      RUN_DOCS: ${{ needs.changes.outputs.code == 'false' && needs.changes.outputs.docs == 'true' }}
    strategy:
      # 3.13 is not a required check; its failure must not cancel the required legs.
      fail-fast: false
      matrix:
        # 3.11 and 3.12 everywhere; 3.13 as well where the old test.yml ran it, on
        # a pull request into main, a push to main and a manual run.
        python-version: ${{ fromJSON((github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.base_ref == 'main') && '["3.11", "3.12", "3.13"]' || '["3.11", "3.12"]') }}

    steps:
      - uses: actions/checkout@v4
        if: env.RUN_ALL == 'true' || env.RUN_DOCS == 'true'

      - name: Set up Python ${{ matrix.python-version }}
        if: env.RUN_ALL == 'true' || env.RUN_DOCS == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        if: env.RUN_ALL == 'true' || env.RUN_DOCS == 'true'
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        if: env.RUN_ALL == 'true' || env.RUN_DOCS == 'true'
        run: |
          uv sync --frozen --extra dev

      # Two kinds of frontend fixture run under Bun here. tests/test_frontend/
      # test_workspace_export.py spawns build_workspace_export_fixture.js, which calls
      # the real frontend/osa-workspace.js and has no package dependencies. The plan
      # tests (test_plan_resume_payload.py, build_plan_payload_fixture.js) load the
      # widget through frontend/test-support/plan-widget-harness.js, which imports
      # happy-dom, so the dependencies are installed too. There is no Bun lockfile in
      # the repo, so this is a plain `bun install`, as in the Frontend job.
      - name: Set up Bun
        if: env.RUN_ALL == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install frontend test dependencies
        if: env.RUN_ALL == 'true'
        run: bun install

      # The union of the two old selections: tests.yml ran everything outside
      # tests/test_integration that is not network or llm, test.yml everything
      # not integration, llm or network. Together that is every test that is not
      # network or llm, which is what this selects.
      - name: Run tests
        if: env.RUN_ALL == 'true'
        env:
          READ_GITHUB_TOKEN: ${{ secrets.READ_GITHUB_TOKEN }}
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=xml -m "not network and not llm"

      # A documentation-only change can still break these tests: the first checks every
      # widget embed snippet in any tracked text file, docs/**/*.md included; the second
      # checks that PRIVACY.md still names the controls of the widget's privacy dialog.
      - name: Run the tests that read documentation
        if: env.RUN_DOCS == 'true'
        run: |
          uv run pytest tests/test_frontend/test_embed_snippet_hygiene.py tests/test_frontend/test_privacy_page.py -v -m "not network and not llm"

      # The widget's light and dark appearance in real Chrome (#469). The bug is the
      # browser's own drawing of form controls on a dark host page, which the happy-dom
      # suite cannot show. The check starts its own two widget_e2e.py servers (the
      # default config, and the same with color_scheme: auto), so it needs this job's
      # Python environment as well as Bun; the runner ships Chrome.
      - name: Check the widget's light and dark appearance in headless Chrome
        if: env.RUN_ALL == 'true' && matrix.python-version == '3.12'
        run: bun frontend/browser-harness/color-scheme-check.mjs --serve

      # Every frame in which the launcher is visible shows the community's look,
      # never the defaults first (#475); needs the same server as the check above.
      - name: Check the widget's first paint in headless Chrome
        if: env.RUN_ALL == 'true' && matrix.python-version == '3.12'
        run: bun frontend/browser-harness/first-paint-check.mjs --serve

      # The launcher's position, size and offsets (#553), sampled on every frame of
      # opening and closing the panel. Serves the widget itself; needs no other server.
      - name: Check the widget's launcher geometry in headless Chrome
        if: env.RUN_ALL == 'true' && matrix.python-version == '3.12'
        timeout-minutes: 8
        run: bun frontend/browser-harness/launcher-geometry-check.mjs

      # The pop-out under the harness's copy of nemar.org's policy, with no
      # 'unsafe-inline' in script-src (#470): it renders from the capsule's chat and
      # notebook tabs, on the tab it came from, and carries the widget tag's
      # integrity, which the browser checks there. Needs the same server.
      - name: Check the widget's pop-out in headless Chrome
        if: env.RUN_ALL == 'true' && matrix.python-version == '3.12'
        run: bun frontend/browser-harness/popout-check.mjs --serve

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: env.RUN_ALL == 'true' && matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-tests:
    name: Frontend Tests
    needs: changes
    # Not a required check, so a job-level skip is fine here.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    # Recent runs take 400 to 465 s with the Chrome harnesses; the Privacy choices harness
    # adds about a minute, so 10 minutes left too little room.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun that builds frontend/osa-runtime.bundle.js. The staleness
          # check below rebuilds and compares bytes, which only means something
          # if CI minifies exactly as the machine that built the bundle did.
          bun-version-file: package.json

      - name: Run citation marker tests
        run: bun frontend/test-citation-markers.js

      - name: Run markdown rendering tests
        run: bun frontend/test-markdown.js

      - name: Run streaming tests
        run: bun frontend/test-streaming.js

      - name: Run endpoint resolution tests
        run: bun frontend/test-endpoint-resolution.js

      - name: Run worker routing tests
        run: bun workers/osa-worker/test-routing.js

      - name: Run worker mounted-hosts agreement test
        run: bun workers/osa-worker/test-mounted-hosts.js

      - name: Run browser runtime lifecycle tests
        run: bun frontend/test-runtime-lifecycle.js

      - name: Run runtime egress control tests
        run: bun frontend/test-egress.js

      - name: Run runtime output capture tests
        run: bun frontend/test-output.js

      - name: Run tool_request controller and highlighter tests
        run: bun frontend/test-controller.js

      # Path validation, manifest derivation, the .ipynb builder and the zip
      # writer, none of which touch IndexedDB (it does not exist under Bun);
      # the zip is checked by unzip and Python's zipfile, both preinstalled
      # on ubuntu-latest.
      - name: Run workspace tests
        run: bun frontend/test-workspace.js

      # The conversation notebook builder's own behavior: cells, import
      # hoisting, left-out runs, ids, the script's shape. That the notebook is
      # valid nbformat and that Jupytext reads the script back is
      # tests/test_frontend/test_notebook_builder.py, in the Python job.
      - name: Run notebook builder tests
        run: bun frontend/test-notebook-builder.js

      # notebook/open.js's pure logic (validation, token filling, entry shape);
      # the real IndexedDB write and redirect are notebook/e2e-check.js, run
      # separately in real Chrome (see notebook/README.md).
      - name: Run notebook bootstrap tests
        run: bun notebook/test-open.js

      # osa-notebook-files.js, the pure half of the notebook page's tabs and
      # import: file names, what an import may hold, which messages to act on.
      # What the page does with them is notebook/e2e-check.js, in real Chrome.
      - name: Run notebook files tests
        run: bun notebook/test-notebook-files.js

      # The worker core runs against the REAL Pyodide from npm, so the Python half
      # of the runtime is tested in CI rather than only by hand in a browser. The
      # npm package carries the interpreter; every wheel a suite loads (numpy, SciPy,
      # matplotlib and the rest) is fetched from the CDN into .cache/pyodide-packages
      # and cached between runs, by the restore and save steps around the suites
      # that load Pyodide (the worker core, the data lane and the built bundle).
      - name: Install frontend test dependencies
        run: bun install

      # Restores the newest cache for this Pyodide. Saved (below) under the hash of
      # the wheels it holds, not of any config, since which wheels a run fetches is
      # decided by every preload list, every lock overlay's depends and whatever a
      # suite loads itself. Keyed on package.json alone, as it was until #495, a
      # wheel added after the cache was saved was fetched again on every run: the key
      # already existed, and a cache is never overwritten.
      #
      #
      # The restore key is a prefix only. Measured on #504: listing the old
      # package.json-only key as well restored the old 13 MB cache over a newer
      # one holding SciPy, in either order, since an exact match of any restore key
      # beats every prefix match. So a scope with no cache under this scheme yet
      # downloads every wheel once and saves one.
      - name: Restore Pyodide packages
        id: pyodide-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package.json') }}-
          restore-keys: pyodide-packages-${{ hashFiles('package.json') }}-

      - name: Run worker core tests against real Pyodide
        run: bun frontend/test-worker-core.js

      # The rejection guard notebook/osa-bridge.js sends to each notebook kernel
      # (#496): the same Python as the runtime's, and a failed pyfetch raises
      # under it rather than hanging, against the same real Pyodide.
      - name: Run notebook bridge tests against real Pyodide
        run: bun notebook/test-bridge.js

      # NEMAR's runtime as it ships: its config, its lock overlay and the wheels
      # beside it, loaded by the real core and reading a sharded store over HTTP.
      - name: Run the NEMAR data lane against real Pyodide
        run: bun frontend/test-data-lane.js

      - name: Check the runtime bundle and its hash are current
        run: bun scripts/build-runtime-bundle.js --check

      - name: Run runtime bundle tests, as built
        run: bun frontend/test-runtime-bundle.js

      # What the suites that load Pyodide left in the cache, against what was
      # restored: equal hashes mean no wheel was fetched and nothing needs saving.
      - name: Show the Pyodide package cache
        if: ${{ !cancelled() }}
        run: |
          echo "restored:  ${{ steps.pyodide-cache.outputs.cache-matched-key || '(nothing)' }}"
          echo "now holds: pyodide-packages-${{ hashFiles('package.json') }}-${{ hashFiles('.cache/pyodide-packages/**') }}"
          echo "wheels:    $(find .cache/pyodide-packages -name "*.whl" 2>/dev/null | wc -l)"

      # Saved only when a run fetched a wheel the restored cache lacked, and after a
      # failed suite too, since the wheels it fetched are still good.
      - name: Save Pyodide packages
        if: ${{ !cancelled() && hashFiles('.cache/pyodide-packages/**') != '' && steps.pyodide-cache.outputs.cache-matched-key != format('pyodide-packages-{0}-{1}', hashFiles('package.json'), hashFiles('.cache/pyodide-packages/**')) }}
        uses: actions/cache/save@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package.json') }}-${{ hashFiles('.cache/pyodide-packages/**') }}

      - name: Run widget browser-execution tests on a real DOM
        run: bun frontend/test-widget-tools.js

      - name: Run the capsule launcher tests on a real DOM
        run: bun frontend/test-widget-capsule.js

      - name: Run the launcher position, size and offset tests on a real DOM
        run: bun frontend/test-widget-launcher-geometry.js

      - name: Run the light and dark appearance tests on a real DOM
        run: bun frontend/test-widget-color-scheme.js

      - name: Run the host page style tests on a real DOM
        run: bun frontend/test-widget-host-styles.js

      - name: Run the notebook tab tests on a real DOM
        run: bun frontend/test-widget-notebook-tab.js

      - name: Run the notebook import tests on a real DOM
        run: bun frontend/test-widget-notebook-import.js

      - name: Run the notebook strip tests on a real DOM
        run: bun frontend/test-widget-notebook-strip.js

      - name: Run the notebook entry point tests on a real DOM
        run: bun frontend/test-widget-notebook-entry.js

      - name: Run the first paint tests on a real DOM
        run: bun frontend/test-widget-first-paint.js

      - name: Run the dataset question tests on a real DOM
        run: bun frontend/test-widget-dataset-questions.js

      - name: Run the pop-out tests on a real DOM
        run: bun frontend/test-widget-popout.js

      - name: Run the conversation store tests on a real DOM
        run: bun frontend/test-widget-history-store.js

      - name: Run the Settings dialog tests on a real DOM
        run: bun frontend/test-widget-settings.js

      # Privacy choices (#706): the footer button and its modal, "Use this page for
      # answers" under its old storage key and "Share usage data" under its own, the
      # share_usage field on /chat and /chat/resume only while it is off, the Tab trap and
      # Escape in the corner and the center, focus returning to the button, and the https
      # privacy link from the community config or the default.
      - name: Run the Privacy choices tests on a real DOM
        run: bun frontend/test-widget-privacy-choices.js

      - name: Run the paced streaming tests on a real DOM
        run: bun frontend/test-widget-paced-streaming.js

      - name: Run the activity status tests on a real DOM
        run: bun frontend/test-widget-activity-status.js

      # The handover stream (#670): the `handover` events and a second `session`
      # event, and how the widget takes them.
      - name: Run the handover stream tests on a real DOM
        run: bun frontend/test-widget-handover-events.js

      # The handover card (#677, E8.3): the stages, the divider, the mode label and the
      # footnote, and all of it back after a reload and from History.
      - name: Run the handover card tests on a real DOM
        run: bun frontend/test-widget-handover-card.js

      # The run card: consent, running, done with and without a figure, each status,
      # the same card after a reload, and a failed run's error, failing line,
      # warnings and cut output, from stderr recorded off real Pyodide.
      - name: Run the run card tests on a real DOM
        run: bun frontend/test-widget-run-card.js

      # The one copy path (#665): the Clipboard API, then the copy command, then the
      # text selected with the keys named, for a reply's code block, the whole-reply
      # copy and the run card, each with a visible "Copied".
      - name: Run the copy tests on a real DOM
        run: bun frontend/test-widget-copy.js

      # A fresh chat on return: a new browser session or a chat over a day old starts a
      # new conversation, never in a pop-out or over an empty chat, and the empty state
      # offers the chat just left.
      - name: Run the fresh chat on return tests on a real DOM
        run: bun frontend/test-widget-fresh-return.js

      # Reseeding a chat the server forgot: the request carries the conversation so far
      # (newest 12 turns, text only, each bounded) and its tier until the server has
      # confirmed the session in this page load, and carries nothing for a new chat.
      - name: Run the reseed tests on a real DOM
        run: bun frontend/test-widget-reseed.js

      # A chat the server forgot while the page stayed open: a request with no turns for a
      # session it names says it expects the session, and the widget sends it once more
      # with the turns when the server answers 409 session_unknown.
      - name: Run the session-lost tests on a real DOM
        run: bun frontend/test-widget-session-lost.js

      # General feedback carries the page's address only when the reader shares the page,
      # as a question does.
      - name: Run the feedback page-address tests on a real DOM
        run: bun frontend/test-widget-feedback-page-url.js

      # The context switch: a page whose dataset or search page differs from the chat's
      # shows a notice and starts a new chat on the next message, or continues with the
      # move told to the assistant; an empty chat switches silently.
      - name: Run the context switch tests on a real DOM
        run: bun frontend/test-widget-context-switch.js

      # The History sheet: chats by day with dataset, step and figure counts, Open,
      # Delete, Clear all (two clicks), off while a reply loads, hidden on the
      # notebook tab; and a run's figures read back from the workspace into restored
      # and opened chats, never into storage.
      - name: Run the History panel tests on a real DOM
        run: bun frontend/test-widget-history-panel.js

      # The host API and the center-stage dialog (E6.1): open, close, ask, setMode and
      # on, queued before init and replayed in order, bad calls refused, events once and
      # safe from a throwing handler; the dialog's role, scrim, inert page, scroll lock,
      # Tab trap, Escape and Move to corner docking the same conversation, and Close
      # returning focus; and the start screen with its cards, footer and https docs link
      # from the community config.
      - name: Run the host API and center-stage tests on a real DOM
        run: bun frontend/test-widget-host-api.js

      # OSAChatWidget.seed (#730): the text becomes the assistant's first message and
      # nothing is sent (no request, no send event, no Turnstile token); it is Markdown,
      # sanitized, unrated, in History and across a reload; a chat with no reader message
      # is reused, one with a message is kept and a new chat opens; the first send carries
      # prior_turns; bad calls warn, calls before init are replayed, a loading reply
      # refuses it. The server's half is tests/test_api/test_reseed.py.
      - name: Run the seed tests on a real DOM
        run: bun frontend/test-widget-seed.js

      # The plan card and the step progress (E2.3, E2.4), the real widget and the runtime
      # bundle as built, with fetch answering recorded-shape SSE: the card and its edits,
      # the decision posted to /chat/resume, consent, step headers, the strip and bar,
      # Stop plan, and a restored chat. The Python half is
      # tests/test_frontend/test_plan_resume_payload.py.
      - name: Run the plan card tests on a real DOM
        run: bun frontend/test-widget-plan-card.js

      # The plan rail beside the center-stage conversation (E6.1, board C3). The logic
      # (frontend/osa-plan-rail.js, reading the plan the way the strip does): none, draft,
      # approved, paused, failed, stopped, done, a re-proposed plan, the run mode.
      - name: Run the plan rail logic tests
        run: bun frontend/test-plan-rail.js

      # The rail on a real DOM, the real widget and the runtime bundle as built: the aside
      # and its rows as steps run, the rows that go to a run card without touching the
      # address, the read-only run mode, "change" opening Settings, the hidden strip, docking
      # without redrawing the thread, Tab order, Escape; and the header's Continue in
      # notebook (visibility rules, the card's import, a busy button).
      - name: Run the plan rail and Continue in notebook tests on a real DOM
        run: bun frontend/test-widget-plan-rail.js

      # The browser memory budget (E5.1): the Settings field and its stored value, the
      # budget on /chat and /chat/resume only from a page with the runtime, the run card's
      # "Heap N MB of B MB" and its warning by step, the plan card's warning, and a reload
      # and History restoring the line. The real widget and the runtime bundle as built.
      - name: Run the memory budget tests on a real DOM
        run: bun frontend/test-widget-memory-budget.js

      # The same reveal in real Chrome, where timers, layout and prefers-reduced-motion
      # are the browser's own: a burst shaped like a reasoning model's is shown at a
      # reading pace, the code block whole, and at once with reduced motion emulated.
      # Its own server, so no backend and no network; the runner ships Chrome.
      - name: Check the paced reveal in headless Chrome
        run: bun frontend/browser-harness/paced-reveal-check.mjs

      # What a pending reply says it is doing (#538), in real Chrome on every painted
      # frame: the labels in order, the wait's length after five real seconds, a
      # status under text that never makes a bubble of its own, and nothing left
      # ticking after. Its own server, so no backend and no network.
      - name: Check the activity status in headless Chrome
        run: bun frontend/browser-harness/activity-status-check.mjs

      # The run card in real Chrome, where layout is the browser's own: the card
      # inside the 400 px panel with no sideways scroll, every button at least 36 px,
      # the failing line marked, and Show code revealing the code. Its own server,
      # so no backend and no network; the runner ships Chrome.
      - name: Check the run card in headless Chrome
        run: bun frontend/browser-harness/run-card-check.mjs

      # The notebook card and the History row menu's notebook items in real Chrome at
      # 400 px, in light and dark: inside the panel, 44 px controls, text at 4.5:1,
      # and the tallest History menu wholly inside the list that clips it. Its own
      # server, so no backend and no network; the runner ships Chrome.
      - name: Check the notebook card and History items in headless Chrome
        env:
          NOTEBOOK_ENTRY_CHECK_SCREENSHOTS: ${{ runner.temp }}/notebook-entry-check
        run: bun frontend/browser-harness/notebook-entry-check.mjs

      - name: Upload the notebook card check screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-entry-check-screenshots
          path: ${{ runner.temp }}/notebook-entry-check
          if-no-files-found: ignore

      # The History sheet and saved figures in real Chrome at 390 x 844: a run that
      # draws a figure is saved to the real IndexedDB, the page reloads, and the figure
      # comes back in the restored chat, in the chat opened from History (and as its
      # row's thumbnail), and in the pop-out. Its own server, so no backend and no
      # network; the runner ships Chrome.
      - name: Check the History sheet and saved figures in headless Chrome
        env:
          HISTORY_CHECK_SCREENSHOTS: ${{ runner.temp }}/history-check
        run: bun frontend/browser-harness/history-check.mjs

      # The screenshots the check took, for a failure to be looked at rather than guessed.
      - name: Upload the History check screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: history-check-screenshots
          path: ${{ runner.temp }}/history-check
          if-no-files-found: ignore

      # The center-stage dialog in real Chrome at 1280 x 900 and 390 x 844, light and
      # dark: inside the viewport with no sideways scroll, the page inert, the real Tab
      # key never leaving the dialog, Escape docking the same conversation, Close giving
      # focus back, pills and send at least 44 px, and the colors at their contrast
      # ratios. Its own server, so no backend and no network; the runner ships Chrome.
      - name: Check the center-stage dialog in headless Chrome
        env:
          CENTER_CHECK_SCREENSHOTS: ${{ runner.temp }}/center-stage-check
        run: bun frontend/browser-harness/center-stage-check.mjs

      - name: Upload the center-stage check screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: center-stage-check-screenshots
          path: ${{ runner.temp }}/center-stage-check
          if-no-files-found: ignore

      # The Privacy choices button and dialog in real Chrome at 1280 x 900 and 390 x 844,
      # light and dark, in the corner and in the center: inside the viewport with no
      # sideways scroll, every target at least 24 px and every row 44, the real Tab key
      # never leaving the dialog, Space toggling, Escape closing only the dialog with
      # focus back on the button, and the colors at their contrast ratios.
      - name: Check the Privacy choices dialog in headless Chrome
        env:
          PRIVACY_CHECK_SCREENSHOTS: ${{ runner.temp }}/privacy-check
        run: bun frontend/browser-harness/privacy-choices-check.mjs

      # Always, not only on failure: the eight combinations are the reviewer's evidence.
      - name: Upload the Privacy choices check screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-check-screenshots
          path: ${{ runner.temp }}/privacy-check
          if-no-files-found: ignore
          retention-days: 14

      # What only a browser can check: Pyodide under a real Content-Security-Policy,
      # the egress guard on a real worker global, and NEMAR's lock overlay loaded by
      # URL with each wheel's sha256 enforced (a valid wheel with other bytes must
      # not start). The runner ships Chrome; the harness downloads Pyodide from the
      # CDN, as a reader's browser does.
      - name: Run the browser harness in headless Chrome
        run: bun frontend/browser-harness/chrome.js

      - name: Check widget syntax
        run: node --check frontend/osa-chat-widget.js

      - name: Check worker syntax
        run: node --check workers/osa-worker/index.js

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Manual only (Actions > Tests > Run workflow). These tests make paid calls to the Claude
    # Platform, OpenRouter and Amazon Bedrock, so they never run on push or on pull requests.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Check the live credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          OPENROUTER_API_KEY_FOR_TESTING: ${{ secrets.OPENROUTER_API_KEY_FOR_TESTING }}
        run: |
          # Presence only, never the values. A missing key makes its tests skip, which a
          # green run hides, so each one is named here. A run with none of them set would
          # skip every live test and still pass, so that fails the job now. A base URL
          # without a workspace ID stops the whole run at startup, so that pair fails it too.
          keys_set=0
          for name in ANTHROPIC_API_KEY AWS_BEARER_TOKEN_BEDROCK OPENROUTER_API_KEY_FOR_TESTING; do
            if [ -n "${!name}" ]; then
              echo "$name is set"
              keys_set=$((keys_set + 1))
            else
              echo "::warning::$name is not set; the tests that need it will skip"
            fi
          done
          if [ "$keys_set" -eq 0 ]; then
            echo "::error::None of the live credentials is set, so every live test would skip"
            exit 1
          fi
          if [ -n "$ANTHROPIC_BASE_URL" ] && [ -z "$ANTHROPIC_WORKSPACE_ID" ]; then
            echo "::error::ANTHROPIC_BASE_URL is set without ANTHROPIC_WORKSPACE_ID"
            exit 1
          fi

      - name: Run live model tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          OPENROUTER_API_KEY_FOR_TESTING: ${{ secrets.OPENROUTER_API_KEY_FOR_TESTING }}
          MODEL_FILTER: ${{ inputs.model }}
        run: |
          # Each module skips itself when its credential is missing, so a Bedrock-only run
          # still runs the Bedrock cases. -k keeps only the cases whose ids name the model.
          SELECT=()
          if [ -n "$MODEL_FILTER" ] && [ "$MODEL_FILTER" != "all" ]; then
            SELECT=(-k "$MODEL_FILTER")
          fi
          uv run pytest tests/ -v -m "integration or llm" --tb=short "${SELECT[@]}"

      - name: Run network tests
        env:
          GITHUB_TOKEN: ${{ secrets.READ_GITHUB_TOKEN }}  # read-only PAT for API rate limits
        run: |
          uv run pytest tests/ -v -m "network" --tb=short
        continue-on-error: true

  all-tests:
    name: All Tests Passed
    needs: [changes, lint, test, frontend-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()
    steps:
      # Not a required check (the rulesets require Lint and the Test legs by name),
      # but the one place a run says whether everything it ran passed, Frontend
      # Tests included (#437).
      - name: Check results
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Classifying the changes failed, so everything ran; see the Classify changes job"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "Python tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-tests.result }}" != "success" ] && [ "${{ needs.frontend-tests.result }}" != "skipped" ]; then
            echo "Frontend tests failed"
            exit 1
          fi
          echo "All required tests passed"
