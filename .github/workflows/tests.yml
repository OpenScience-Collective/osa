name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install ruff
        run: |
          uv pip install --system ruff

      - name: Ruff check
        run: |
          ruff check src tests

      - name: Ruff format check
        run: |
          ruff format --check src tests

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests
        env:
          READ_GITHUB_TOKEN: ${{ secrets.READ_GITHUB_TOKEN }}
        run: |
          pytest --ignore=tests/test_integration -v --cov=src --cov-report=xml -m "not network"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run citation marker tests
        run: bun frontend/test-citation-markers.js

      - name: Run streaming tests
        run: bun frontend/test-streaming.js

      - name: Check widget syntax
        run: node --check frontend/osa-chat-widget.js
