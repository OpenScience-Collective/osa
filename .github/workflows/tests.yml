name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Ruff check
        run: |
          uv run ruff check src tests

      - name: Ruff format check
        run: |
          uv run ruff format --check src tests

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run tests
        env:
          READ_GITHUB_TOKEN: ${{ secrets.READ_GITHUB_TOKEN }}
        run: |
          uv run pytest --ignore=tests/test_integration -v --cov=src --cov-report=xml -m "not network"

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.12'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Run citation marker tests
        run: bun frontend/test-citation-markers.js

      - name: Run streaming tests
        run: bun frontend/test-streaming.js

      - name: Run endpoint resolution tests
        run: bun frontend/test-endpoint-resolution.js

      - name: Check widget syntax
        run: node --check frontend/osa-chat-widget.js

  all-tests:
    name: All Tests Passed
    needs: [lint, test, frontend-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "Python tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-tests.result }}" != "success" ] && [ "${{ needs.frontend-tests.result }}" != "skipped" ]; then
            echo "Frontend tests failed"
            exit 1
          fi
          echo "All required tests passed"
