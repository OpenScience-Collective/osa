name: eegprep-lean Drift Watch

# Watches sccn/eegprep's develop branch for a newer commit touching
# packages/eegprep-lean than the one vendored beside NEMAR's prompt (#432).
# Nothing else watches upstream for this package: a re-vendor only happens when
# someone remembers to check by hand, and this is that memory.
#
# scripts/eegprep_lean_drift.py does the actual comparison, by commit rather than
# by version string alone (a version can sit still across more than one upstream
# commit). See that script's module docstring, and
# src/assistants/nemar/runtime/README.md for the refresh procedure this points at.

on:
  schedule:
    # Weekly. eegprep-lean changes rarely enough that this needn't be more
    # frequent, and the refresh itself is a deliberate, reviewed pull request,
    # not something to rush into on a tighter schedule.
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: Check eegprep-lean against upstream
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.drift.outputs.status }}
      report: ${{ steps.drift.outputs.report }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run the drift watcher
        id: drift
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          # stderr too, so a crash's traceback reaches the issue.
          output="$(uv run python scripts/eegprep_lean_drift.py 2>&1)"
          echo "$output"

          # A random delimiter, so no line of the report can end the value early.
          delimiter="report_$(openssl rand -hex 8)"
          {
            echo "report<<$delimiter"
            echo "$output"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

          # The status is read from the watcher's own status line, never from its
          # exit code: a crash exits 1 as well, and must read as unknown.
          status="$(printf '%s\n' "$output" | grep -oE '^status=(current|behind|unknown)( |$)' | tail -n 1 | cut -d= -f2 | tr -d ' ')"
          echo "status=${status:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Fail the run so the schedule surfaces it
        if: steps.drift.outputs.status != 'current'
        run: exit 1

  # A separate job, so the issue opens even when the check job fails before the
  # watcher runs (checkout included): this job checks out only the action it
  # needs, on its own runner. Not on a cancelled run, which is neither green nor
  # failing and which the action would otherwise read as green.
  track:
    name: Track the issue
    needs: watch
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions

      - uses: ./.github/actions/track-issue
        with:
          label: eegprep-lean-drift
          title: 'eegprep-lean drift check needs attention'
          failed: ${{ needs.watch.result == 'failure' || needs.watch.outputs.status != 'current' }}
          recovery_message: 'the eegprep-lean drift check'
          report: |
            The weekly eegprep-lean drift watcher's status: **${{ needs.watch.outputs.status || 'unknown' }}**.

            ```
            ${{ needs.watch.outputs.report || 'The watch job failed before the watcher ran (checkout, Python or `uv sync`); nothing was checked.' }}
            ```

            Refresh procedure: `src/assistants/nemar/runtime/README.md`.

            `unknown` means the watcher itself could not tell: a GitHub fetch or a parse
            failed (the report above says which), or the job never reached it at all.
            It needs a look, and is never read as "no drift". `behind` means the watcher
            fetched successfully and upstream has a newer commit than the one vendored.
