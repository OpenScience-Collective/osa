name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - develop
    # Kept, but it is NOT what fires on a release: a release created through the
    # API or the UI creates its tag as part of the release, and GitHub emits the
    # `release` event WITHOUT a corresponding tag `push`. That is why no image was
    # built for v0.8.9 -- the only run on that ref was `Publish to PyPI`, whose
    # trigger list already included `release`. This trigger still covers a tag
    # pushed by hand with `git push --tags`.
    tags:
      - 'v*'
  release:
    types: [published]
  # Lets a maintainer rebuild a specific tag on demand:
  #   gh workflow run docker-build.yml --ref v0.8.9
  # Which is also how to republish images for a release that predates this fix.
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - develop

# Two pushes to the same ref must not interleave their tag writes. The v0.8.9
# release pushed two commits to `main` ten seconds apart; both builds ran, both
# wrote `:latest`, they finished one second apart, and the OLDER commit's image
# won -- so production served 0.8.9.dev0 while `main` said 0.8.9. Serialized by
# ref, the later run writes last. Never cancel: a cancelled run can be one that
# is already pushing layers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # First job: Build and test the image before pushing
  build-and-test:
    name: Build and Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: |
          docker build -t osa-test:ci -f ./deploy/Dockerfile --build-arg GIT_COMMIT=${{ github.sha }} .

      - name: Smoke test - Start container
        run: |
          docker run -d --name osa-test \
            -p 38528:38528 \
            -e REQUIRE_API_AUTH=false \
            -e OPENROUTER_API_KEY=test-key-for-ci \
            osa-test:ci

      - name: Wait for container to be healthy
        run: |
          echo "Waiting for container to initialize..."
          for i in {1..60}; do
            if curl -sf http://localhost:38528/health > /dev/null 2>&1; then
              echo "Container is healthy after $i seconds"
              exit 0
            fi
            sleep 1
          done
          echo "Container failed to become healthy within 60 seconds"
          docker logs osa-test
          exit 1

      - name: Smoke test - Check container health status
        run: |
          STATUS=$(docker inspect --format='{{.State.Health.Status}}' osa-test 2>/dev/null || echo "no-healthcheck")
          echo "Container health status: $STATUS"
          if [ "$STATUS" = "unhealthy" ]; then
            echo "Container is unhealthy! Logs:"
            docker logs osa-test
            exit 1
          fi

      - name: Cleanup test container
        if: always()
        run: |
          docker stop osa-test || true
          docker rm osa-test || true

  # Second job: Push to registry (on main, develop, and tags - not PRs)
  build-and-push:
    name: Build and Push to GHCR
    needs: build-and-test
    # Push on main, develop, a tag, or a published release - skip for PRs.
    # A release event carries `github.ref` of `refs/tags/<tag>`, so the semver
    # patterns below read it the same way a tag push would.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Branch-based tags: `main` and `develop` always point at the head of
            # their branch, for anyone who wants exactly that.
            type=ref,event=branch
            # Versioned, immutable tags (v1.0.0 -> 1.0.0, 1.0). These are the
            # rollback targets. None existed between 0.6.2 and 0.8.9 because the
            # release event never reached this workflow.
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # `latest` means THE LATEST RELEASE, not the head of the default
            # branch. Production (`deploy/auto-update.sh`) pulls `:latest`, so
            # this is what decides what it serves: a released version, built from
            # the tagged commit, rather than whichever main push last won a race.
            # Use `:main` to follow the branch instead.
            type=raw,value=latest,enable=${{ github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v') }}
            # Dev tag for develop branch
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/develop' }}
            # Commit SHA for traceability
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "${{ steps.meta.outputs.tags }}"
