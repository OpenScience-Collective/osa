name: Create GitHub Release

# DEAD SINCE FEBRUARY 2026, repaired here (#442).
#
# The only trigger used to be `push: tags`. tag-release.yml pushes the tag
# through a checkout with no `token:` override, so that push is authored by the
# default GITHUB_TOKEN, and GitHub deliberately does not start workflow runs
# from those pushes. This workflow therefore stopped running the moment tag
# creation moved into CI: zero runs of any kind for v0.8.9 through v0.8.12, the
# last being v0.6.2, back when a real token pushed tags.
#
# The visible symptom was that published release notes carried tag-release.yml's
# plain commit log and never the "Widget Embedding" section below, which is the
# only place the SRI hash for a version-pinned embed is published. Consumers
# were being pointed at a section that did not exist.
#
# `release: types: [published]` is how publish.yml already survives the same
# limitation: `gh release create` runs under CI_ADMIN_TOKEN, a real PAT, which
# does emit downstream events. The tag push is kept for a hand-pushed tag.
# Updating a release emits `edited`, not `published`, so this cannot loop.
#
# Takes effect on the release AFTER the one that merges it, because GitHub reads
# a workflow's triggers from the default branch.
on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build release notes for, such as v0.8.13'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: |
          # GITHUB_REF is the tag ref for both `push: tags` and `release`,
          # but not for a manual dispatch, which supplies the tag directly.
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VERSION="${{ github.event.inputs.tag }}"
            VERSION=${VERSION#v}
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # Determine if prerelease (contains a, b, rc, or dev)
          if [[ "$VERSION" =~ (a[0-9]+|b[0-9]+|rc[0-9]+|\.dev[0-9]+) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION is a pre-release"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION is a stable release"
          fi

      - name: Generate release notes
        id: notes
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            COMMITS=$(git log --oneline --no-decorate -20)
          else
            # Get commits since previous tag
            COMMITS=$(git log --oneline --no-decorate ${PREV_TAG}..HEAD)
          fi

          # Create release notes file
          cat > /tmp/release_notes.md << EOF
          ## What's Changed

          ${COMMITS}

          **Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG:-initial}...v${{ steps.version.outputs.version }}
          EOF

          echo "Generated release notes for v${{ steps.version.outputs.version }}"
      - name: Append widget SRI hash to release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          HASH=$(python3 -c "
          import hashlib, base64
          with open('frontend/osa-chat-widget.js', 'rb') as f:
              content = f.read()
          print('sha384-' + base64.b64encode(hashlib.sha384(content).digest()).decode())
          ")
          export OSA_VERSION="$VERSION"
          export OSA_SRI="$HASH"
          python3 - <<'PYEOF'
          import os
          import pathlib

          version = os.environ["OSA_VERSION"]
          sri = os.environ["OSA_SRI"]
          section = [
              "",
              "## Widget Embedding",
              "",
              "**Standard** (always latest):",
              "```html",
              '<script src="https://demo.osc.earth/osa-chat-widget.js"></script>',
              "```",
              "",
              "**Versioned + SRI** (for supply-chain-secure environments):",
              "```html",
              f'<script src="https://cdn.jsdelivr.net/gh/OpenScience-Collective/osa@v{version}/frontend/osa-chat-widget.js"',
              f'        integrity="{sri}"',
              '        crossorigin="anonymous"></script>',
              "<script>",
              "  OSAChatWidget.setConfig({ communityId: 'hed' });",
              "</script>",
              "```",
              "> Pin to this exact release. Update the tag when upgrading.",
              "",
          ]
          path = pathlib.Path("/tmp/release_notes.md")
          path.write_text(path.read_text() + "\n".join(section))
          PYEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OSA ${{ steps.version.outputs.tag }}"
          body_path: /tmp/release_notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
