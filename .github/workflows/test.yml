name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Skip tests for automated version-strip commits (version-only changes)
    if: |
      !(github.actor == 'github-actions[bot]' &&
        contains(github.event.head_commit.message || '', 'strip dev suffix'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check src tests

      # Scoped to the notebook site's own workflows (PR review finding, #465):
      # a hand-written run: block there is exactly the kind of shell mistake
      # actionlint's embedded shellcheck catches, and nothing else in this
      # repository's CI statically checks a workflow file at all. Not run
      # against every workflow in .github/workflows/ -- fixing whatever that
      # would surface elsewhere is a separate change. Version pinned so a new
      # actionlint release cannot silently change what this step accepts.
      - name: Check the notebook site workflows with actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12
          ./actionlint .github/workflows/deploy-notebook.yml .github/workflows/notebook-site-check.yml

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Skip tests for automated version-strip commits (version-only changes)
    if: |
      !(github.actor == 'github-actions[bot]' &&
        contains(github.event.head_commit.message || '', 'strip dev suffix'))
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      # tests/test_frontend/test_workspace_export.py spawns a small Bun
      # script (build_workspace_export_fixture.js) that calls the real
      # frontend/osa-workspace.js; it has no external package dependencies,
      # so `bun` on PATH is enough here, with no `bun install` needed.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Run unit tests
        run: |
          uv run pytest tests/ -v --cov=src --cov-report=xml --cov-report=term \
            -m "not integration and not llm and not network"

      # The widget's light and dark appearance in real Chrome (#469). The bug is the
      # browser's own drawing of form controls on a dark host page, which the happy-dom
      # suite cannot show. The check starts its own two widget_e2e.py servers (the
      # default config, and the same with color_scheme: auto), so it needs this job's
      # Python environment as well as Bun; the runner ships Chrome.
      - name: Check the widget's light and dark appearance in headless Chrome
        if: matrix.python-version == '3.12'
        run: bun frontend/browser-harness/color-scheme-check.mjs --serve

      # Every frame in which the launcher is visible shows the community's look,
      # never the defaults first (#475); needs the same server as the check above.
      - name: Check the widget's first paint in headless Chrome
        if: matrix.python-version == '3.12'
        run: bun frontend/browser-harness/first-paint-check.mjs --serve

      # The pop-out under the harness's copy of nemar.org's policy, with no
      # 'unsafe-inline' in script-src (#470): it renders from the capsule's chat and
      # notebook tabs, on the tab it came from, and carries the widget tag's
      # integrity, which the browser checks there. Needs the same server.
      - name: Check the widget's pop-out in headless Chrome
        if: matrix.python-version == '3.12'
        run: bun frontend/browser-harness/popout-check.mjs --serve

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The Bun that builds frontend/osa-runtime.bundle.js. The staleness
          # check below rebuilds and compares bytes, which only means something
          # if CI minifies exactly as the machine that built the bundle did.
          bun-version-file: package.json

      - name: Run citation marker tests
        run: bun frontend/test-citation-markers.js

      - name: Run streaming tests
        run: bun frontend/test-streaming.js

      - name: Run endpoint resolution tests
        run: bun frontend/test-endpoint-resolution.js

      - name: Run worker routing tests
        run: bun workers/osa-worker/test-routing.js

      - name: Run worker mounted-hosts agreement test
        run: bun workers/osa-worker/test-mounted-hosts.js

      - name: Run browser runtime lifecycle tests
        run: bun frontend/test-runtime-lifecycle.js

      - name: Run runtime egress control tests
        run: bun frontend/test-egress.js

      - name: Run runtime output capture tests
        run: bun frontend/test-output.js

      - name: Run tool_request controller and highlighter tests
        run: bun frontend/test-controller.js

      # Path validation, manifest derivation, the .ipynb builder and the zip
      # writer, none of which touch IndexedDB (it does not exist under Bun);
      # the zip is checked by unzip and Python's zipfile, both preinstalled
      # on ubuntu-latest.
      - name: Run workspace tests
        run: bun frontend/test-workspace.js

      # notebook/open.js's pure logic (validation, token filling, entry shape);
      # the real IndexedDB write and redirect are notebook/e2e-check.js, run
      # separately in real Chrome (see notebook/README.md).
      - name: Run notebook bootstrap tests
        run: bun notebook/test-open.js

      # The worker core runs against the REAL Pyodide from npm, so the Python half
      # of the runtime is tested in CI rather than only by hand in a browser. The
      # npm package carries the interpreter; every wheel a suite loads (numpy, SciPy,
      # matplotlib and the rest) is fetched from the CDN into .cache/pyodide-packages
      # and cached between runs, by the restore and save steps around the suites
      # that load Pyodide (the worker core, the data lane and the built bundle).
      - name: Install frontend test dependencies
        run: bun install

      # Restores the newest cache for this Pyodide. Saved (below) under the hash of
      # the wheels it holds, not of any config, since which wheels a run fetches is
      # decided by every preload list, every lock overlay's depends and whatever a
      # suite loads itself. Keyed on package.json alone, as it was until #495, a
      # wheel added after the cache was saved was fetched again on every run: the key
      # already existed, and a cache is never overwritten.
      #
      # A restore key that matches a cache EXACTLY wins over a newer prefix match
      # (measured on #504: with only the second line, a rerun restored the old
      # 13 MB cache over the newer one holding SciPy). So the dash-terminated
      # prefix, which matches no key exactly, comes first and finds the newest
      # cache saved below; the second line is the old key, used only until one is.
      - name: Restore Pyodide packages
        id: pyodide-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package.json') }}-
          restore-keys: |
            pyodide-packages-${{ hashFiles('package.json') }}-
            pyodide-packages-${{ hashFiles('package.json') }}

      - name: Run worker core tests against real Pyodide
        run: bun frontend/test-worker-core.js

      # The rejection guard notebook/osa-bridge.js sends to each notebook kernel
      # (#496): the same Python as the runtime's, and a failed pyfetch raises
      # under it rather than hanging, against the same real Pyodide.
      - name: Run notebook bridge tests against real Pyodide
        run: bun notebook/test-bridge.js

      # NEMAR's runtime as it ships: its config, its lock overlay and the wheels
      # beside it, loaded by the real core and reading a sharded store over HTTP.
      - name: Run the NEMAR data lane against real Pyodide
        run: bun frontend/test-data-lane.js

      - name: Check the runtime bundle and its hash are current
        run: bun scripts/build-runtime-bundle.js --check

      - name: Run runtime bundle tests, as built
        run: bun frontend/test-runtime-bundle.js

      # What the suites that load Pyodide left in the cache, against what was
      # restored: equal hashes mean no wheel was fetched and nothing needs saving.
      - name: Show the Pyodide package cache
        if: ${{ !cancelled() }}
        run: |
          echo "restored:  ${{ steps.pyodide-cache.outputs.cache-matched-key || '(nothing)' }}"
          echo "now holds: pyodide-packages-${{ hashFiles('package.json') }}-${{ hashFiles('.cache/pyodide-packages/**') }}"
          echo "wheels:    $(find .cache/pyodide-packages -name "*.whl" 2>/dev/null | wc -l)"

      # Saved only when a run fetched a wheel the restored cache lacked, and after a
      # failed suite too, since the wheels it fetched are still good.
      - name: Save Pyodide packages
        if: ${{ !cancelled() && hashFiles('.cache/pyodide-packages/**') != '' && steps.pyodide-cache.outputs.cache-matched-key != format('pyodide-packages-{0}-{1}', hashFiles('package.json'), hashFiles('.cache/pyodide-packages/**')) }}
        uses: actions/cache/save@v4
        with:
          path: .cache/pyodide-packages
          key: pyodide-packages-${{ hashFiles('package.json') }}-${{ hashFiles('.cache/pyodide-packages/**') }}

      - name: Run widget browser-execution tests on a real DOM
        run: bun frontend/test-widget-tools.js

      - name: Run the capsule launcher tests on a real DOM
        run: bun frontend/test-widget-capsule.js

      - name: Run the light and dark appearance tests on a real DOM
        run: bun frontend/test-widget-color-scheme.js

      - name: Run the notebook tab tests on a real DOM
        run: bun frontend/test-widget-notebook-tab.js

      - name: Run the first paint tests on a real DOM
        run: bun frontend/test-widget-first-paint.js

      - name: Run the dataset question tests on a real DOM
        run: bun frontend/test-widget-dataset-questions.js

      - name: Run the pop-out tests on a real DOM
        run: bun frontend/test-widget-popout.js

      # What only a browser can check: Pyodide under a real Content-Security-Policy,
      # the egress guard on a real worker global, and NEMAR's lock overlay loaded by
      # URL with each wheel's sha256 enforced (a valid wheel with other bytes must
      # not start). The runner ships Chrome; the harness downloads Pyodide from the
      # CDN, as a reader's browser does.
      - name: Run the browser harness in headless Chrome
        run: bun frontend/browser-harness/chrome.js

      - name: Check widget syntax
        run: node --check frontend/osa-chat-widget.js

      - name: Check worker syntax
        run: node --check workers/osa-worker/index.js

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Run on push to main or workflow_dispatch, but not on PRs (to save API costs)
    # Skip for automated version-strip commits (version-only changes)
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      !(github.actor == 'github-actions[bot]' &&
        contains(github.event.head_commit.message || '', 'strip dev suffix'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev

      - name: Check for Anthropic credentials
        id: check-anthropic-key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "has_anthropic_key=true" >> $GITHUB_OUTPUT
          else
            echo "has_anthropic_key=false" >> $GITHUB_OUTPUT
            echo "::warning::ANTHROPIC_API_KEY not set - skipping integration tests"
          fi

      - name: Run integration tests
        if: steps.check-anthropic-key.outputs.has_anthropic_key == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          uv run pytest tests/ -v -m "integration or llm" --tb=short

      - name: Run network tests
        env:
          GITHUB_TOKEN: ${{ secrets.READ_GITHUB_TOKEN }}  # read-only PAT for API rate limits
        run: |
          uv run pytest tests/ -v -m "network" --tb=short
        continue-on-error: true

  all-tests:
    name: All Tests Passed
    needs: [lint, unit-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          # Skipped tests (for bot version-strip commits) count as success
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "Lint failed"
            exit 1
          fi
          if [ "${{ needs.unit-tests.result }}" != "success" ] && [ "${{ needs.unit-tests.result }}" != "skipped" ]; then
            echo "Unit tests failed"
            exit 1
          fi
          # frontend-tests was listed in `needs` but never checked here, so a
          # red frontend job still reported "All Tests Passed" (#437). That is
          # where the worker routing tests live, and this workflow is the one
          # that runs on a develop -> main release PR, so the gap was worst
          # exactly when it mattered most. tests.yml already checks this.
          if [ "${{ needs.frontend-tests.result }}" != "success" ] && [ "${{ needs.frontend-tests.result }}" != "skipped" ]; then
            echo "Frontend tests failed"
            exit 1
          fi
          echo "All required tests passed"
