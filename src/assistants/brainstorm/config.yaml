# Sync schedule configuration (offset from other communities to avoid overlap)
sync:
  github:
    cron: "15 2 * * *"      # daily at 2:15am UTC
  papers:
    cron: "15 3 * * 0"      # weekly Sunday at 3:15am UTC
  docstrings:
    cron: "15 4 * * 1"      # weekly Monday at 4:15am UTC
  discourse:
    cron: "15 5 * * *"      # daily at 5:15am UTC (incremental; the first sync takes about 2 hours)

# GitHub repositories for issue/PR sync
github:
  repos:
    - brainstorm-tools/brainstorm3
    - brainstorm-tools/bst-users
    - brainstorm-tools/bst-duneuro

# Paper/citation search configuration
citations:
  queries:
    - Brainstorm MEG EEG analysis software
    - Brainstorm source imaging MEG
    - Brainstorm EEG source localization
    - Brainstorm sEEG epilepsy analysis
    - NIRSTORM fNIRS Brainstorm
    - Brainstorm DUNEuro finite element head model
  dois:
    - "10.1155/2011/879716"               # Brainstorm: A User-Friendly Application for MEG/EEG Analysis (Tadel et al., 2011)
    - "10.3389/fnins.2019.00076"          # MEG/EEG Group Analysis With Brainstorm (Tadel et al., 2019)
    - "10.3389/fnins.2019.00284"          # Brainstorm Pipeline Analysis of Resting-State Data From the Open MEG Archive (Niso et al., 2019)
    - "10.1016/j.neuroimage.2022.119851"  # Brainstorm-DUNEuro: FEM for modeling electromagnetic brain activity (Medani et al., 2023)
  # Short labels for the public citations dashboard (stacked series legend)
  paper_labels:
    "10.1155/2011/879716": "Brainstorm (Tadel 2011)"
    "10.3389/fnins.2019.00076": "Group analysis (Tadel 2019)"
    "10.3389/fnins.2019.00284": "Resting state (Niso 2019)"
    "10.1016/j.neuroimage.2022.119851": "DUNEuro FEM (Medani 2023)"

# Discourse forum: the Brainstorm user forum, where users and the development team discuss
# problems. Synced categories: Discussions, Bugs, Requests, News (slug "announce", release
# news) and Uncategorized. Left out: Job opportunities (id 19) and Announcements (id 21,
# notices about the forum). The forum has no topics marked solved, so most topics are
# answered by their most-liked reply or else by a reply from the development team (forum
# staff); see _get_accepted_answer in src/knowledge/discourse_sync.py for the full order.
discourse:
  - url: https://neuroimage.usc.edu/forums
    categories:
      - slug: discussions
        id: 18
      - slug: bugs
        id: 17
      - slug: requests
        id: 20
      - slug: announce
        id: 16
      - slug: uncategorized
        id: 1

# Docstring extraction configuration
# Brainstorm puts each function's help right after its definition line (as MATLAB's help does),
# followed by a license block that the parser leaves out. bst-users holds scripts shared by users.
docstrings:
  repos:
    - repo: brainstorm-tools/brainstorm3
      branch: master
      languages: [matlab]
    - repo: brainstorm-tools/bst-users
      branch: master
      languages: [matlab]
    - repo: brainstorm-tools/bst-duneuro
      branch: master
      languages: [matlab]
