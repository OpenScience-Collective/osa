# OpenNeuroPET Assistant Configuration
# Single source of truth for the OpenNeuroPET community assistant

id: openneuropet
name: OpenNeuroPET Assistant
description: Technical support and documentation access for Open and Reproducible tools in PET imaging
status: available

default_model: anthropic/claude-haiku-4.5
default_model_provider: anthropic

# Per-community OpenRouter API key for cost attribution
# Set this environment variable on the backend server with the community's key
openrouter_api_key_env_var: OPENROUTER_API_KEY_OPENNEUROPET

# External links for dashboard and discovery
links:
  homepage: https://openneuropet.github.io/
  repository: https://github.com/openneuropet/

# CORS origins for widget embedding
cors_origins:
  - https://openneuropet.github.io

# Budget limits for cost management
budget:
  daily_limit_usd: 5.00
  monthly_limit_usd: 50.00
  alert_threshold_pct: 80.0

# Widget configuration for frontend embedding
widget:
  title: OpenNeuroPET Assistant
  initial_message: "Hi! I'm the OpenNeuroPET Assistant. I can help with Open and Reproducible tools in PET imaging."
  placeholder: Ask about our tools and codes...
  suggested_questions:
    - What tools are available?
    - Where can I get data for these tools?
    - What is PET BIDS?
    - How do I process my PET data?

# Community maintainers (GitHub usernames)
maintainers:
  - CPernet
  - martinnorgaard
  - mathesong

# System prompt template with runtime-substituted placeholders
# Placeholders (in curly braces) are replaced by CommunityAssistant at runtime:
#   {preloaded_docs_section} - Embedded documentation content
#   {available_docs_section} - List of on-demand retrievable docs
#   {page_context_section} - Widget context tool instructions
#   {additional_instructions} - Runtime-specific instructions
#   {repo_list} - GitHub repos tracked by the assistant
system_prompt: |
  You are a technical assistant for OpenNeuroPET, a community of open and reproducible tools for Positron Emission Tomography (PET) imaging.
  You help users with PET data conversion to BIDS, PET preprocessing and analysis pipelines (kinetic modelling), blood data handling, and PET-specific image processing tools.

  Focus on the OpenNeuroPET ecosystem: PET2BIDS (DICOM/ECAT to BIDS conversion), petprep (BIDS App for preprocessing), bloodstream (blood data analysis), petfit (kinetic modelling), and PetSurfer.
  Reference related concepts (PET physics, kinetic modelling, BIDS, neuroimaging best practices) when they help answer the user's question.

  Base your responses on official OpenNeuroPET documentation, the PET-BIDS specification, and the tools available to you.
  Always attempt to answer the user's question. Use the documentation tools to verify facts when unsure rather than declining to answer.

  Useful references:
  - OpenNeuroPET homepage: https://openneuropet.github.io/
  - OpenNeuroPET tool overview: https://github.com/openneuropet/openneuropet.github.io/wiki
  - PET-BIDS specification: https://bids-specification.readthedocs.io/en/stable/modality-specific-files/positron-emission-tomography.html
  - PetSurfer wiki: https://surfer.nmr.mgh.harvard.edu/fswiki/PetSurfer
  - GitHub organization: https://github.com/openneuropet/

  ## Response Style

  Keep responses structured and brief:
  - Use markdown headers to organize, but keep each section to 1-2 sentences
  - Aim for 200-300 words; never exceed 400 unless the user asks for detail
  - End with 1-2 specific follow-up suggestions so the user drives the conversation
  - When showing code examples, show ONE focused snippet, not complete workflows
  - Always cite sources with links to documentation or GitHub

  ## Tracked Repositories

  The following GitHub repositories are indexed for issue/PR discovery:
  {repo_list}

  Use the knowledge discovery tools to surface recent activity, related discussions, or PRs from these repos.

  {preloaded_docs_section}

  {available_docs_section}

  {page_context_section}

  {additional_instructions}

# Documentation sources
# - preload: true = embedded in system prompt (recommended: 2-3 core docs to keep prompt lean)
# - preload: false/omitted = fetched on demand via retrieve_docs tool
documentation:
  - title: Getting Started
    url: https://github.com/openneuropet/openneuropet.github.io/wiki
    source_url: https://raw.githubusercontent.com/wiki/openneuropet/openneuropet.github.io/Home.md
    preload: true
    category: quickstart
    description: Overview of OpenNeuroPET tools, getting started guide, and pointers to community resources.
  - title: petprep overview
    url: https://petprep.readthedocs.io/en/latest/
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/README.rst
    category: analysis
    description: Overview of PETPrep, a NiPreps application for standardised and robust PET data preprocessing.
  - title: petprep installation
    url: https://petprep.readthedocs.io/en/latest/installation.html
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/docs/installation.rst
    category: analysis
    description: Instructions for installing PETPrep using Docker/Singularity containers or a bare-metal Python environment.
  - title: petprep usage
    url: https://petprep.readthedocs.io/en/latest/usage.html
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/docs/usage.rst
    category: analysis
    description: Usage notes for running PETPrep with BIDS-formatted PET datasets, including command-line options and execution details.
  - title: petprep workflows
    url: https://petprep.readthedocs.io/en/latest/workflows.html
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/docs/workflows.rst
    category: analysis
    description: Details on the PETPrep processing pipeline, including motion correction, PVC, and spatial normalisation workflows.
  - title: petprep outputs
    url: https://petprep.readthedocs.io/en/latest/outputs.html
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/docs/outputs.rst
    category: analysis
    description: Description of PETPrep output derivatives, visual QA reports, and confound files produced by the pipeline.
  - title: petprep FAQ
    url: https://petprep.readthedocs.io/en/latest/faq.html
    source_url: https://raw.githubusercontent.com/nipreps/petprep/main/docs/faq.rst
    category: analysis
    description: Frequently asked questions about PETPrep usage, data quality requirements, and preprocessing decisions.
  - title: petfit overview
    url: https://petfit.readthedocs.io/en/latest/
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/index.md
    category: analysis
    description: PETFit is a BIDS App for fitting kinetic models to PET time activity curve (TAC) data, producing parameter estimates and QC reports. Supports interactive (GUI) and automatic (CLI) modes.
  - title: petfit installation
    url: https://petfit.readthedocs.io/en/latest/installation.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/installation.md
    category: analysis
    description: Installing PETFit via Docker (recommended), Apptainer, or the R package.
  - title: petfit quick start
    url: https://petfit.readthedocs.io/en/latest/quickstart.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/quickstart.md
    category: analysis
    description: Two-step PETFit workflow - region definition (once per dataset) then kinetic modelling - run interactively or from the command line.
  - title: petfit usage guide
    url: https://petfit.readthedocs.io/en/latest/usage/index.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/index.md
    category: analysis
    description: Overview of the region-definition and kinetic-modelling stages and the three Shiny apps (region definition, plasma input, reference tissue).
  - title: petfit region definition
    url: https://petfit.readthedocs.io/en/latest/usage/region-definition.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/region-definition.md
    category: analysis
    description: First step of a PETFit workflow - combining individual brain regions from PET preprocessing derivatives into analysis-ready TACs via the petfit_regions.tsv file.
  - title: petfit plasma input modelling
    url: https://petfit.readthedocs.io/en/latest/usage/modelling-plasma.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/modelling-plasma.md
    category: analysis
    description: Configuring and running invasive kinetic models that require an arterial blood input function (raw _blood.tsv or processed _inputfunction.tsv data).
  - title: petfit reference tissue modelling
    url: https://petfit.readthedocs.io/en/latest/usage/modelling-reference.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/modelling-reference.md
    category: analysis
    description: Configuring and running non-invasive kinetic models that use a reference brain region instead of arterial blood data.
  - title: petfit supported models
    url: https://petfit.readthedocs.io/en/latest/models.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/models.md
    category: analysis
    description: Kinetic models available in PETFit (via kinfitr) - plasma input models (1TCM, 2TCM, Logan, etc.) and reference tissue models.
  - title: petfit reports
    url: https://petfit.readthedocs.io/en/latest/usage/reports.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/reports.md
    category: analysis
    description: Parameterised HTML quality-control reports generated for every analysis step, with interactive plots, data summaries, and diagnostics.
  - title: petfit outputs
    url: https://petfit.readthedocs.io/en/latest/outputs.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/outputs.md
    category: analysis
    description: PETFit output files following BIDS derivatives conventions in derivatives/petfit/, including parameter estimates and HTML reports.
  - title: petfit folder structure
    url: https://petfit.readthedocs.io/en/latest/usage/folder-structure.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/usage/folder-structure.md
    category: analysis
    description: How PETFit organises its outputs in a structured hierarchy within the BIDS derivatives directory.
  - title: petfit Docker usage
    url: https://petfit.readthedocs.io/en/latest/containers/docker.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/containers/docker.md
    category: analysis
    description: Advanced Docker options and CLI reference for running PETFit container images.
  - title: petfit Apptainer usage
    url: https://petfit.readthedocs.io/en/latest/containers/apptainer.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/containers/apptainer.md
    category: analysis
    description: Running PETFit with Apptainer (formerly Singularity), the standard container runtime on HPC clusters.
  - title: petfit R API reference
    url: https://petfit.readthedocs.io/en/latest/api.html
    source_url: https://raw.githubusercontent.com/mathesong/petfit/main/docs/api.md
    category: analysis
    description: Reference for PETFit's main R functions for launching apps and running pipelines (e.g. petfit_interactive()).
  - title: PetSurfer Wiki
    url: https://surfer.nmr.mgh.harvard.edu/fswiki/PetSurfer
    source_url: https://surfer.nmr.mgh.harvard.edu/fswiki/PetSurfer
    category: analysis
    description: PetSurfer pipeline for partial volume correction and kinetic modelling using FreeSurfer.
  - title: PET-BIDS Specification
    url: https://bids-specification.readthedocs.io/en/stable/modality-specific-files/positron-emission-tomography.html
    source_url: https://raw.githubusercontent.com/bids-standard/bids-specification/master/src/modality-specific-files/positron-emission-tomography.md
    category: bids
    description: Official PET extension to the Brain Imaging Data Structure (BIDS) specification.

# Sync schedule configuration
# Each sync type runs on its own cron schedule (UTC)
sync:
  github:
    cron: "0 2 * * *"       # daily at 2am UTC

# GitHub repositories for issue/PR sync
github:
  repos:
    - openneuropet/openneuropet.github.io
    - openneuropet/PET2BIDS
    - nipreps/petprep
    - mathesong/bloodstream
    - mathesong/petfit
